<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>AeroDesign - Overlay</title>

    <link rel="stylesheet" href="../shared/styles/tokens.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            width: 1920px;
            height: 1080px;
            font-family: var(--font-body);
            overflow: hidden;
            /* Transparent so OBS composites the overlay over the video feed. */
            background: transparent;
        }

        .overlay-container {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /*
         * Development guides: the 1920x1080 boundary and the title-safe area.
         * Off by default so nothing leaks on air - enable with ?dev=1.
         */
        .dev-guides { display: none; }

        body.dev .dev-guides { display: block; }

        .dev-border {
            position: absolute;
            inset: 0;
            border: 2px dashed rgba(255, 60, 60, 0.5);
            pointer-events: none;
            z-index: 9999;
        }

        .dev-safe {
            position: absolute;
            inset: 54px 96px;
            border: 1px dashed rgba(80, 200, 255, 0.35);
            pointer-events: none;
            z-index: 9999;
        }

        .dev-border::before {
            content: '1920x1080 · dev';
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(255, 60, 60, 0.75);
            color: #fff;
            padding: 4px 9px;
            border-radius: 4px;
            font: 600 12px var(--font-body);
        }

        /* Backdrop shown only in the browser preview, never in OBS. */
        body.dev { background:
            radial-gradient(1200px 700px at 30% 25%, #24405e, #0b1220 70%);
            /* Scaled to fit the window by fitToWindow(); the scale factor
               itself has to come from JS because scale() needs a plain number
               and CSS cannot divide 100vw by 1920. */
            transform-origin: top left; }

        /*
         * Sample footage to judge the overlay against, preview only. It gets a
         * src only under ?dev=1, so the OBS source never fetches it, and it
         * only becomes visible once it has actually loaded - a missing file
         * leaves the gradient above as the backdrop instead of a black frame.
         */
        .dev-backdrop {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
            z-index: 0;
        }

        body.dev .dev-backdrop.ready { display: block; }

        .aerotv-logo {
            position: absolute;
            bottom: 26px;
            right: 34px;
            width: 168px;
            height: auto;
            opacity: 0.85;
            z-index: 1000;
            filter: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.6));
            animation: logo-in 900ms cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes logo-in {
            from { opacity: 0; transform: translateY(14px); }
            to   { opacity: 0.85; transform: translateY(0); }
        }

        /* Connection warning, preview only - never rendered on the broadcast. */
        .offline {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 14px 24px;
            border-radius: 10px;
            background: rgba(180, 30, 30, 0.9);
            color: #fff;
            font: 600 15px var(--font-body);
            display: none;
            z-index: 10000;
        }

        body.dev .offline.show { display: block; }

        /*
         * Browsers refuse to autoplay with sound before the page has been
         * interacted with, so when that happens the preview starts muted and
         * says what to do about it.
         */
        .dev-sound-hint {
            position: absolute;
            bottom: 24px;
            left: 34px;
            padding: 11px 17px;
            border-radius: 8px;
            background: rgba(8, 12, 22, 0.9);
            border: 1px solid var(--surface-line);
            color: var(--text);
            font: 600 14px var(--font-body);
            display: none;
            z-index: 10000;
        }

        body.dev .dev-sound-hint.show { display: block; }
    </style>
</head>
<body>
    <div class="overlay-container">
        <video class="dev-backdrop" id="devBackdrop" loop playsinline></video>

        <div class="dev-guides">
            <div class="dev-border"></div>
            <div class="dev-safe"></div>
        </div>

        <status-bar id="statusBar"></status-bar>
        <custom-message id="customMessage"></custom-message>
        <info-panel id="infoPanel"></info-panel>
        <team-lower-third id="teamCard"></team-lower-third>
        <standings-board id="standingsBoard"></standings-board>

        <img src="assets/aerotv-logo.png" alt="AeroTV" class="aerotv-logo">

        <div class="offline" id="offline">Sem conexão com o servidor</div>
        <div class="dev-sound-hint" id="soundHint">Clique na página para ativar o som</div>
    </div>

    <!--
      250ms rather than 500ms: the poll interval, not the animation, dominates
      how long it takes the overlay to react to an operator's click. The payload
      is a few KB over localhost or the LAN, so the extra requests are cheap.
    -->
    <api-service auto-poll poll-rate="250"></api-service>

    <script type="module" src="../shared/components/api-service.js"></script>
    <script type="module" src="./components/status-bar.js"></script>
    <script type="module" src="./components/team-lower-third.js"></script>
    <script type="module" src="./components/info-panel.js"></script>
    <script type="module" src="./components/standings-board.js"></script>
    <script type="module" src="./components/custom-message.js"></script>

    <script type="module">
        const params = new URLSearchParams(window.location.search);

        if (params.get('dev') === '1') {
            document.body.classList.add('dev');

            // The overlay is authored at a fixed 1920x1080. In the preview that
            // is usually larger than the window, so the frame gets scaled down
            // to fit and centred - the whole thing visible, ratio intact. OBS
            // renders at native size and never runs any of this.
            document.documentElement.style.background = '#05080f';

            const fitToWindow = () => {
                const scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
                const x = (window.innerWidth - 1920 * scale) / 2;
                const y = (window.innerHeight - 1080 * scale) / 2;
                document.body.style.transform = `translate(${x}px, ${y}px) scale(${scale})`;
            };

            fitToWindow();
            window.addEventListener('resize', fitToWindow);

            // ?sample=<url> plays your own footage instead of the placeholder.
            const backdrop = document.getElementById('devBackdrop');
            backdrop.addEventListener('loadeddata', () => backdrop.classList.add('ready'));
            backdrop.src = params.get('sample') || 'assets/sample.mp4';

            // Sound needs a gesture the first time. Rather than lose the video
            // to a rejected play(), fall back to muted and unmute on the click.
            backdrop.play().catch(() => {
                const hint = document.getElementById('soundHint');
                backdrop.muted = true;
                backdrop.play().catch(() => {});
                hint.classList.add('show');

                document.addEventListener('click', () => {
                    backdrop.muted = false;
                    hint.classList.remove('show');
                }, { once: true });
            });
        }

        const statusBar = document.getElementById('statusBar');
        const teamCard = document.getElementById('teamCard');
        const infoPanel = document.getElementById('infoPanel');
        const standingsBoard = document.getElementById('standingsBoard');
        const customMessage = document.getElementById('customMessage');
        const offline = document.getElementById('offline');

        // How long the exit animation needs before the replacement comes in.
        const SWAP_DELAY = 460;

        let currentTeamId = null;
        let swapping = false;

        document.addEventListener('state-updated', (event) => applyState(event.detail));

        document.addEventListener('connection-changed', (event) => {
            offline.classList.toggle('show', !event.detail.online);
        });

        function applyState(state) {
            // The top bar is independent of team changes - it never blinks out.
            if (state.visible && state.show_top_bar && state.conditions) {
                statusBar.show(state.conditions);
            } else {
                statusBar.hide();
            }

            if (state.custom_message && state.visible) {
                customMessage.show(state.custom_message);
            } else {
                customMessage.hide();
            }

            // Keep the countdown in sync every poll, even mid-swap, so it never
            // jumps when the card reappears.
            if (state.timer) teamCard.syncTimer(state.timer);

            const nextTeamId = state.team ? state.team.id : null;
            const teamChanged = currentTeamId !== null
                && nextTeamId !== null
                && currentTeamId !== nextTeamId;

            if (teamChanged && !swapping) {
                // Let the outgoing team animate away before the new one lands.
                swapping = true;
                teamCard.hide();
                infoPanel.hide();

                setTimeout(() => {
                    swapping = false;
                    currentTeamId = nextTeamId;
                    renderTeam(state);
                }, SWAP_DELAY);
                return;
            }

            if (!swapping) {
                currentTeamId = nextTeamId;
                renderTeam(state);
            }
        }

        function renderTeam(state) {
            const panel = state.panel || 'none';
            // The board is a full-screen graphic: it takes the frame over rather
            // than stacking on top of the lower third and the side panel.
            const boardUp = state.visible && panel === 'board';
            const showCard = state.visible && state.team && state.show_team_info && !boardUp;

            if (showCard) {
                teamCard.show(state.team, {
                    ranking: state.team_ranking,
                    showBattery: state.show_current_battery,
                    showTimer: state.show_takeoff_timer,
                    timer: state.timer
                });
            } else {
                teamCard.hide();
            }

            if (state.visible && panel !== 'none' && !boardUp) {
                infoPanel.show(panel, {
                    results: state.team ? state.team.flight_results : [],
                    ranking: state.ranking || [],
                    upcoming: state.upcoming || [],
                    currentTeamId: state.team ? state.team.id : null
                });
            } else {
                infoPanel.hide();
            }

            if (boardUp) {
                standingsBoard.show(state.ranking || [], state.team ? state.team.id : null);
            } else {
                standingsBoard.hide();
            }
        }

        console.log('AeroDesign Overlay ready');
    </script>
</body>
</html>
